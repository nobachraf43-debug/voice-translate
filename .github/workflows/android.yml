name: Build Voice Translate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip and build
        run: |
          unzip -o VoiceTranslate_Android_Project.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslate-APK
          path: project/**/*.apk
